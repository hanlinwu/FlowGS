model:
  target: models.second_stage_fm.S2Model
  base_learning_rate: 1.0e-05
  params:
    start_from_noise: True
    concat_context: True
    # if true, we provide input to cross-attention
    ca_context: False
    # Flow matching model
    fm_cfg:
      target: models.flow.ShortcutFlowModel
      params:
        segment_K: 128
        boostrap_every: 4
        schedule: linear
        net_cfg:
          target: modules.efficient_unet.model.EfficientShortcutUnet
          params:
            in_channels: 8    # 4 for the low-res image, 4 for the noise
            model_channels: 64
            out_channels: 4
            num_res_blocks: 3
            channel_mult: [1, 2, 4, 8]
            # This isn't the resolution but the down-sampling factor.
            # For each channel multiplier we down-sample the image
            # by a factor of 2. Hence, the down-sampling factor increases
            # by a factor of 2 for each channel multiplier. For an image
            # with size 64x64 and four channel multipliers, the down-sampling
            # factors are 1, 2, 4, 8. The attention resolutions are then
            # 64, 32, 16, 8.
            attention_resolutions: [8, 16]
            dropout: 0.0
            conv_resample: True
            dim_head: 64
            num_heads: 4
            use_linear_attn: False
            use_scale_shift_norm: True
            pool_factor: -1
    # first stage (KL-Autoencoder from LDM)
    scale_factor: 1
    first_stage_cfg:
      target: models.first_stage_kl_gs.AutoencoderKLFinetune
      params:
          embed_dim: 4
          ckpt_path: checkpoints/first_stage_gs_res_v1.ckpt
          encoder_config:
            target: modules.e2sr.s1_v6.GAPEncoder
            params:
              in_channels: 6
              ch: 64
              ch_mult: [1, 2, 2, 4]
              num_res_blocks: 2
              attn_resolutions: []
              z_channels: 4
              double_z: true
          decoder_config:
            target: modules.e2sr.s1_gs_res_v1.GAPDecoder
            params:
              ch: 64
              out_ch: 3
              ch_mult: [1, 1, 1, 1]
              num_res_blocks: 2
              attn_resolutions: []
              z_channels: 4
              in_channels: 3
              num_sr_modules: [12, 12, 12, 12]
              num_gaussians: 100
              gaussian_kernel_size: 7
              gaussian_hidden_dim: 256
    cond_stage_cfg:
      target: modules.e2sr.s1_v6.GAPEncoder
      params:
        in_channels: 3
        ch: 64
        ch_mult: [1, 2, 2, 4]
        num_res_blocks: 2
        attn_resolutions: []
        z_channels: 4
        double_z: false
    weight_decay: 0.0
    ema_rate: 0.999
    ema_update_every: 1
    ema_update_after_step: 1000
    use_ema_for_sampling: True
    metric_tracker_cfg:
      target: metrics.metric_logger.ImageMetricTracker
      params:
        num_crops: 4
        crop_size: 512
        calc_fid: False
    lr_scheduler_cfg:
      target: utils.lr_schedulers.get_constant_schedule_with_warmup
      params:
        num_warmup_steps: 1000
    log_grad_norm: True
    validation_timesteps: [1, 2, 4]

data:
  target: data.datamodule.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 16
    wrap: false
    train:
      target: data.downsampled_dataset.MultiScaleDownsampledDatasetWithFixedHRSize
      params:
        datapath: load/AID_split/train/HR
        min_scale: 1
        max_scale: 8
        is_train: true
        hr_img_sz: 512
        cache: memory
        data_length: 8000
        batch_size: 8
    validation:
      target: data.downsampled_dataset.DownsampledDataset
      params:
        datapath: load/AID_split/val/HR
        scale: 4
        is_train: false
        first_k: 2
        cache: memory

lightning:
  trainer:
    max_epochs: 400
    reload_dataloaders_every_n_epochs: 1
